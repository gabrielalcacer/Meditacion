<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090d16" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Calma — Meditación & Respiración</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%23090d16'/%3E%3Ccircle cx='256' cy='256' r='160' fill='%232dd4bf' opacity='0.2'/%3E%3Ccircle cx='256' cy='256' r='105' fill='none' stroke='%232dd4bf' stroke-width='16'/%3E%3Ccircle cx='256' cy='256' r='32' fill='%23f8fafc'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%23090d16'/%3E%3Ccircle cx='256' cy='256' r='160' fill='%232dd4bf' opacity='0.2'/%3E%3Ccircle cx='256' cy='256' r='105' fill='none' stroke='%232dd4bf' stroke-width='16'/%3E%3Ccircle cx='256' cy='256' r='32' fill='%23f8fafc'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg-deep: #090d16;
      --bg-surface: rgba(20, 29, 47, 0.65);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-teal: #2dd4bf;
      --accent-indigo: #818cf8;
      --accent-amber: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 25%, #131c31 0%, var(--bg-deep) 75%);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-teal);
      box-shadow: 0 0 12px var(--accent-teal);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .pill-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .pill-btn.sos {
      border-color: rgba(251, 191, 36, 0.4);
      color: var(--accent-amber);
    }

    .pill-btn.install {
      border-color: rgba(45, 212, 191, 0.45);
      color: var(--accent-teal);
      display: none;
    }

    .pill-btn:active {
      transform: scale(0.96);
    }

    /* Esfera central de respiración */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      my: 16px;
      min-height: 290px;
    }

    .orb-wrapper {
      position: relative;
      width: 230px;
      height: 230px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .orb-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(45, 212, 191, 0.22) 0%, rgba(129, 140, 248, 0.05) 70%, transparent 100%);
      transform: scale(0.65);
      transition: transform 0.3s ease-out;
      pointer-events: none;
    }

    .orb-core {
      position: relative;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(45, 212, 191, 0.35), rgba(15, 23, 42, 0.9));
      border: 1.5px solid rgba(45, 212, 191, 0.5);
      box-shadow: 0 0 40px rgba(45, 212, 191, 0.18), inset 0 0 25px rgba(45, 212, 191, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transform: scale(0.8);
      transition: transform 0.3s ease-out, border-color 0.6s ease;
      cursor: pointer;
    }

    .phase-label {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.6px;
      color: var(--text-main);
      margin-bottom: 4px;
      text-align: center;
    }

    .timer-display {
      font-size: 1.65rem;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      color: var(--accent-teal);
    }

    .sub-status {
      margin-top: 22px;
      font-size: 0.82rem;
      color: var(--text-muted);
      letter-spacing: 0.3px;
      min-height: 1.2em;
    }

    /* Panel de controles */
    .controls-card {
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 18px;
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .row-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .row-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }

    .chip-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 8px 6px;
      border-radius: 12px;
      font-size: 0.78rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .chip.active {
      background: rgba(45, 212, 191, 0.16);
      border-color: var(--accent-teal);
      color: var(--text-main);
      font-weight: 500;
    }

    .sound-Controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent-teal);
      height: 5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      margin-top: 4px;
    }

    .main-btn {
      background: var(--accent-teal);
      color: #06211e;
      border: none;
      border-radius: 14px;
      padding: 13px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s;
    }

    .main-btn.running {
      background: rgba(244, 63, 94, 0.2);
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.4);
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      border-radius: 14px;
      padding: 0 14px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn.active {
      border-color: var(--accent-indigo);
      color: var(--accent-indigo);
      background: rgba(129, 140, 248, 0.14);
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding-top: 6px;
      border-top: 1px solid var(--border-subtle);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-dot"></span>
      <span>calma.</span>
    </div>
    <div class="header-actions">
      <button id="installBtn" class="pill-btn install">⬇ Instalar App</button>
      <button id="sosBtn" class="pill-btn sos">⚡ SOS 2 min</button>
    </div>
  </header>

  <main class="stage">
    <div class="orb-wrapper">
      <div id="orbRing" class="orb-ring"></div>
      <div id="orbCore" class="orb-core" title="Toca para iniciar o pausar">
        <div id="phaseLabel" class="phase-label">Listo</div>
        <div id="timerDisplay" class="timer-display">10:00</div>
      </div>
    </div>
    <div id="subStatus" class="sub-status">Toca el círculo para comenzar</div>
  </main>

  <section class="controls-card">
    <!-- Duración -->
    <div class="row-group">
      <div class="row-header">
        <span>Duración (minutos)</span>
        <span id="bellStatus">Cuenco al final</span>
      </div>
      <div class="chip-group" id="durationGroup">
        <button class="chip" data-min="5">5m</button>
        <button class="chip active" data-min="10">10m</button>
        <button class="chip" data-min="15">15m</button>
        <button class="chip" data-min="20">20m</button>
      </div>
    </div>

    <!-- Patrón de respiración -->
    <div class="row-group">
      <div class="row-header">
        <span>Patrón de Respiración</span>
        <span id="patternDesc">4-4-4-4</span>
      </div>
      <div class="chip-group" id="patternGroup">
        <button class="chip active" data-pattern="box">Cuadrada</button>
        <button class="chip" data-pattern="478">4-7-8</button>
        <button class="chip" data-pattern="coherent">Coherente</button>
        <button class="chip" data-pattern="free">Libre</button>
      </div>
    </div>

    <!-- Ambiente sonoro -->
    <div class="row-group">
      <div class="row-header">
        <span>Sonido Generativo (Offline)</span>
        <span id="volLabel">Vol: 60%</span>
      </div>
      <div class="chip-group" id="soundGroup">
        <button class="chip active" data-sound="rain">Lluvia</button>
        <button class="chip" data-sound="brown">Marrón</button>
        <button class="chip" data-sound="theta">Om 136Hz</button>
        <button class="chip" data-sound="mute">Silencio</button>
      </div>
      <div class="sound-Controls">
        <span style="font-size: 0.8rem; color: var(--text-muted);">🔈</span>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.02" value="0.6" />
        <span style="font-size: 0.8rem; color: var(--text-muted);">🔊</span>
      </div>
    </div>

    <!-- Botones de acción -->
    <div class="action-row">
      <button id="startBtn" class="main-btn">Iniciar sesión</button>
      <button id="voiceCueBtn" class="icon-btn" title="Pulso sonoro al cambiar de fase">🔔 Guía</button>
      <button id="bowlBtn" class="icon-btn" title="Tocar cuenco tibetano">🥣 Cuenco</button>
    </div>

    <div class="stats-bar">
      <span id="sessionsStat">Sesiones: 0</span>
      <span id="minutesStat">Tiempo total: 0 min</span>
    </div>
  </section>

  <script>
    // --- Configuraciones de respiración ---
    const PATTERNS = {
      box: {
        desc: "4s Inhala · 4s Retén · 4s Exhala · 4s Retén",
        phases: [
          { name: "Inhala", dur: 4, scale: 1.18, freq: 432 },
          { name: "Retén", dur: 4, scale: 1.18, freq: 528 },
          { name: "Exhala", dur: 4, scale: 0.72, freq: 396 },
          { name: "Calma", dur: 4, scale: 0.72, freq: 396 }
        ]
      },
      "478": {
        desc: "4s Inhala · 7s Retén · 8s Exhala",
        phases: [
          { name: "Inhala", dur: 4, scale: 1.2, freq: 432 },
          { name: "Retén", dur: 7, scale: 1.2, freq: 528 },
          { name: "Exhala lento", dur: 8, scale: 0.7, freq: 396 }
        ]
      },
      coherent: {
        desc: "5s Inhala · 5s Exhala (Coherencia)",
        phases: [
          { name: "Inhala", dur: 5, scale: 1.18, freq: 440 },
          { name: "Exhala", dur: 5, scale: 0.72, freq: 396 }
        ]
      },
      free: {
        desc: "Sin guía de ritmo · Solo temporizador",
        phases: [
          { name: "Respira", dur: 8, scale: 1.0, freq: 432 }
        ]
      }
    };

    // --- Estado ---
    let durationMin = 10;
    let remainingSec = 600;
    let currentPattern = "box";
    let currentSound = "rain";
    let isRunning = false;
    let audioCuesEnabled = false;
    let timerInterval = null;
    let phaseTimeout = null;
    let phaseIndex = 0;
    let wakeLock = null;

    // --- Web Audio API ---
    let audioCtx = null;
    let masterGain = null;
    let activeNodes = [];

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = parseFloat(document.getElementById("volumeSlider").value);
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function stopAmbientSound() {
      activeNodes.forEach(node => {
        try {
          if (node.stop) node.stop();
          if (node.disconnect) node.disconnect();
        } catch (e) {}
      });
      activeNodes = [];
    }

    function startAmbientSound() {
      stopAmbientSound();
      if (!isRunning || currentSound === "mute") return;
      initAudio();

      if (currentSound === "brown" || currentSound === "rain") {
        const bufferSize = 2 * audioCtx.sampleRate;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          output[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = output[i];
          output[i] *= (currentSound === "rain" ? 2.2 : 3.2);
        }
        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = currentSound === "rain" ? "bandpass" : "lowpass";
        filter.frequency.value = currentSound === "rain" ? 950 : 280;
        filter.Q.value = currentSound === "rain" ? 0.7 : 1.0;

        whiteNoise.connect(filter);
        filter.connect(masterGain);
        whiteNoise.start(0);
        activeNodes.push(whiteNoise, filter);
      } else if (currentSound === "theta") {
        // Drone armónico Om 136.1 Hz + 204.15 Hz (quinta justa)
        [136.1, 139.1, 204.15].forEach(freq => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.value = freq;
          gain.gain.value = 0.18;
          osc.connect(gain);
          gain.connect(masterGain);
          osc.start();
          activeNodes.push(osc, gain);
        });
      }
    }

    function playTibetanBowl() {
      initAudio();
      const now = audioCtx.currentTime;
      const partials = [256, 512, 768, 1024];
      partials.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq + (idx * 1.5);
        const startGain = 0.25 / (idx + 1);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(startGain, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 5.5 - idx * 0.8);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 5.6);
      });
    }

    function playPhaseCue(freq) {
      if (!audioCuesEnabled || !isRunning) return;
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.06, now + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.75);
    }

    // --- Temporizador y Fases ---
    const orbCore = document.getElementById("orbCore");
    const orbRing = document.getElementById("orbRing");
    const phaseLabel = document.getElementById("phaseLabel");
    const timerDisplay = document.getElementById("timerDisplay");
    const subStatus = document.getElementById("subStatus");
    const startBtn = document.getElementById("startBtn");

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, "0");
      const s = (sec % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function runBreathingCycle() {
      if (!isRunning) return;
      const phases = PATTERNS[currentPattern].phases;
      const phase = phases[phaseIndex % phases.length];

      phaseLabel.textContent = phase.name;
      orbCore.style.transition = `transform ${phase.dur}s ease-in-out`;
      orbRing.style.transition = `transform ${phase.dur}s ease-in-out`;
      orbCore.style.transform = `scale(${phase.scale})`;
      orbRing.style.transform = `scale(${phase.scale * 1.15})`;

      playPhaseCue(phase.freq);

      phaseTimeout = setTimeout(() => {
        phaseIndex++;
        runBreathingCycle();
      }, phase.dur * 1000);
    }

    async function requestWakeLock() {
      if ("wakeLock" in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request("screen");
        } catch (e) {}
      }
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    function toggleSession() {
      if (isRunning) {
        stopSession(false);
      } else {
        startSession();
      }
    }

    function startSession() {
      initAudio();
      isRunning = true;
      phaseIndex = 0;
      startBtn.textContent = "Detener sesión";
      startBtn.classList.add("running");
      subStatus.textContent = PATTERNS[currentPattern].desc;

      playTibetanBowl();
      startAmbientSound();
      requestWakeLock();
      runBreathingCycle();

      timerInterval = setInterval(() => {
        remainingSec--;
        timerDisplay.textContent = formatTime(remainingSec);
        if (remainingSec <= 0) {
          stopSession(true);
        }
      }, 1000);
    }

    function stopSession(completed) {
      isRunning = false;
      clearInterval(timerInterval);
      clearTimeout(phaseTimeout);
      stopAmbientSound();
      releaseWakeLock();

      orbCore.style.transition = "transform 0.6s ease";
      orbRing.style.transition = "transform 0.6s ease";
      orbCore.style.transform = "scale(0.8)";
      orbRing.style.transform = "scale(0.65)";

      startBtn.textContent = "Iniciar sesión";
      startBtn.classList.remove("running");

      if (completed) {
        playTibetanBowl();
        phaseLabel.textContent = "Namasté";
        subStatus.textContent = "Sesión completada con éxito";
        saveStats(durationMin);
      } else {
        phaseLabel.textContent = "Pausa";
        subStatus.textContent = "Toca el círculo para reanudar";
      }
      remainingSec = durationMin * 60;
      timerDisplay.textContent = formatTime(remainingSec);
    }

    // --- Almacenamiento de Estadísticas ---
    function loadStats() {
      const sessions = parseInt(localStorage.getItem("calma_sessions") || "0", 10);
      const minutes = parseInt(localStorage.getItem("calma_minutes") || "0", 10);
      document.getElementById("sessionsStat").textContent = `Sesiones: ${sessions}`;
      document.getElementById("minutesStat").textContent = `Tiempo total: ${minutes} min`;
    }

    function saveStats(addedMin) {
      const sessions = parseInt(localStorage.getItem("calma_sessions") || "0", 10) + 1;
      const minutes = parseInt(localStorage.getItem("calma_minutes") || "0", 10) + addedMin;
      localStorage.setItem("calma_sessions", sessions);
      localStorage.setItem("calma_minutes", minutes);
      loadStats();
    }

    // --- Eventos de Interfaz ---
    orbCore.addEventListener("click", toggleSession);
    startBtn.addEventListener("click", toggleSession);
    document.getElementById("bowlBtn").addEventListener("click", playTibetanBowl);

    document.getElementById("voiceCueBtn").addEventListener("click", (e) => {
      audioCuesEnabled = !audioCuesEnabled;
      e.currentTarget.classList.toggle("active", audioCuesEnabled);
    });

    document.getElementById("sosBtn").addEventListener("click", () => {
      if (isRunning) stopSession(false);
      durationMin = 2;
      remainingSec = 120;
      currentPattern = "box";
      currentSound = "rain";
      timerDisplay.textContent = formatTime(remainingSec);
      startSession();
    });

    document.getElementById("durationGroup").addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      document.querySelectorAll("#durationGroup .chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      durationMin = parseInt(btn.dataset.min, 10);
      if (!isRunning) {
        remainingSec = durationMin * 60;
        timerDisplay.textContent = formatTime(remainingSec);
      }
    });

    document.getElementById("patternGroup").addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      document.querySelectorAll("#patternGroup .chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      currentPattern = btn.dataset.pattern;
      document.getElementById("patternDesc").textContent = PATTERNS[currentPattern].desc.split("·")[0];
      if (isRunning) {
        clearTimeout(phaseTimeout);
        phaseIndex = 0;
        runBreathingCycle();
      }
    });

    document.getElementById("soundGroup").addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      document.querySelectorAll("#soundGroup .chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      currentSound = btn.dataset.sound;
      if (isRunning) startAmbientSound();
    });

    document.getElementById("volumeSlider").addEventListener("input", (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById("volLabel").textContent = `Vol: ${Math.round(val * 100)}%`;
      if (masterGain) masterGain.gain.value = val;
    });

    loadStats();

    // --- Instalación PWA y Service Worker ---
    let deferredPrompt = null;
    const installBtn = document.getElementById("installBtn");

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = "inline-block";
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = "none";
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
