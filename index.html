<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090d16" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Calma — Meditación Personal</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%23090d16'/%3E%3Ccircle cx='256' cy='256' r='160' fill='%232dd4bf' opacity='0.2'/%3E%3Ccircle cx='256' cy='256' r='105' fill='none' stroke='%232dd4bf' stroke-width='16'/%3E%3Ccircle cx='256' cy='256' r='32' fill='%23f8fafc'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%23090d16'/%3E%3Ccircle cx='256' cy='256' r='160' fill='%232dd4bf' opacity='0.2'/%3E%3Ccircle cx='256' cy='256' r='105' fill='none' stroke='%232dd4bf' stroke-width='16'/%3E%3Ccircle cx='256' cy='256' r='32' fill='%23f8fafc'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg-deep: #090d16;
      --bg-surface: rgba(20, 29, 47, 0.65);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-teal: #2dd4bf;
      --accent-indigo: #818cf8;
      --accent-amber: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 25%, #131c31 0%, var(--bg-deep) 75%);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-teal);
      box-shadow: 0 0 12px var(--accent-teal);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .pill-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .pill-btn.sos {
      border-color: rgba(251, 191, 36, 0.4);
      color: var(--accent-amber);
    }

    .pill-btn.install {
      border-color: rgba(45, 212, 191, 0.45);
      color: var(--accent-teal);
      display: none;
    }

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      margin: 6px 0;
      min-height: 200px;
    }

    .orb-wrapper {
      position: relative;
      width: 195px;
      height: 195px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .orb-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(45, 212, 191, 0.22) 0%, rgba(129, 140, 248, 0.05) 70%, transparent 100%);
      transform: scale(0.65);
      transition: transform 0.3s ease-out;
      pointer-events: none;
    }

    .orb-core {
      position: relative;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(45, 212, 191, 0.35), rgba(15, 23, 42, 0.9));
      border: 1.5px solid rgba(45, 212, 191, 0.5);
      box-shadow: 0 0 40px rgba(45, 212, 191, 0.18), inset 0 0 25px rgba(45, 212, 191, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transform: scale(0.8);
      transition: transform 0.3s ease-out, box-shadow 0.4s ease;
      cursor: pointer;
    }

    .orb-core.speaking {
      box-shadow: 0 0 55px rgba(129, 140, 248, 0.45), inset 0 0 30px rgba(45, 212, 191, 0.35);
      border-color: var(--accent-indigo);
    }

    .phase-label {
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: var(--text-main);
      margin-bottom: 2px;
      text-align: center;
    }

    .timer-display {
      font-size: 1.5rem;
      font-weight: 300;
      font-variant-numeric: tabular-nums;
      color: var(--accent-teal);
    }

    .guide-subtitle {
      margin-top: 14px;
      font-size: 0.84rem;
      color: #e2e8f0;
      text-align: center;
      max-width: 360px;
      min-height: 2.4em;
      line-height: 1.35;
      padding: 0 10px;
      font-style: italic;
      opacity: 0.9;
    }

    .controls-card {
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 14px;
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
    }

    .meditation-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .med-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: 11px;
      padding: 7px 10px;
      text-align: left;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .med-card.full-width {
      grid-column: span 2;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
    }

    .med-card.active {
      background: rgba(45, 212, 191, 0.15);
      border-color: var(--accent-teal);
    }

    .med-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .med-sub {
      font-size: 0.67rem;
      color: var(--text-muted);
    }

    .chip-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .chip-group.two-cols {
      grid-template-columns: repeat(2, 1fr);
    }

    .chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 7px 4px;
      border-radius: 10px;
      font-size: 0.74rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chip.active {
      background: rgba(45, 212, 191, 0.16);
      border-color: var(--accent-teal);
      color: var(--text-main);
      font-weight: 500;
    }

    .sound-Controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 2px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent-teal);
      height: 5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 7px;
      margin-top: 2px;
    }

    .main-btn {
      background: var(--accent-teal);
      color: #06211e;
      border: none;
      border-radius: 13px;
      padding: 11px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .main-btn.running {
      background: rgba(244, 63, 94, 0.2);
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.4);
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      border-radius: 13px;
      padding: 0 12px;
      font-size: 0.76rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn.active {
      border-color: var(--accent-indigo);
      color: var(--accent-indigo);
      background: rgba(129, 140, 248, 0.16);
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-muted);
      padding-top: 4px;
      border-top: 1px solid var(--border-subtle);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-dot"></span>
      <span>calma.</span>
    </div>
    <div class="header-actions">
      <button id="installBtn" class="pill-btn install">⬇ Instalar App</button>
      <button id="sosBtn" class="pill-btn sos">⚡ SOS 2 min</button>
    </div>
  </header>

  <main class="stage">
    <div class="orb-wrapper">
      <div id="orbRing" class="orb-ring"></div>
      <div id="orbCore" class="orb-core">
        <div id="phaseLabel" class="phase-label">Listo</div>
        <div id="timerDisplay" class="timer-display">10:00</div>
      </div>
    </div>
    <div id="guideSubtitle" class="guide-subtitle">Calma Base (Headspace) lista para empezar</div>
  </main>

  <section class="controls-card">
    <!-- Selector de tipo de Meditación (5 Programas) -->
    <div class="row-group">
      <div class="row-header">
        <span>Tipo de Meditación</span>
        <span id="medPackInfo">Archivos: 01 - 08</span>
      </div>
      <div class="meditation-grid" id="meditationGroup">
        <button class="med-card active" data-med="base">
          <span class="med-title">🧘 Calma Base</span>
          <span class="med-sub">Estilo Headspace (01-08)</span>
        </button>
        <button class="med-card" data-med="disconnect">
          <span class="med-title">🌇 Desconectar</span>
          <span class="med-sub">Soltar el día (desc_01-06)</span>
        </button>
        <button class="med-card" data-med="sleep">
          <span class="med-title">🌙 Dormir Profundo</span>
          <span class="med-sub">Sin gong final (dormir_01-06)</span>
        </button>
        <button class="med-card" data-med="focus">
          <span class="med-title">⚡ Enfoque Claro</span>
          <span class="med-sub">Claridad mental (foco_01-06)</span>
        </button>
        <button class="med-card full-width" data-med="smile">
          <span class="med-title">😊 Lo que te hace sonreír</span>
          <span class="med-sub">Apreciación Headspace (sonreir_01-06)</span>
        </button>
      </div>
    </div>

    <!-- Voz IA vs Silencio y Duración -->
    <div class="row-group">
      <div class="row-header">
        <span>Guía de Voz y Duración</span>
        <span id="voiceStatus">Voz IA activa</span>
      </div>
      <div class="chip-group two-cols" id="voiceModeGroup" style="margin-bottom: 4px;">
        <button class="chip active" data-voice="ai">✨ Voz IA (Magnific)</button>
        <button class="chip" data-voice="mute">🔇 Sin Voz (Solo Fondo)</button>
      </div>
      <div class="chip-group" id="durationGroup">
        <button class="chip" data-min="5">5m</button>
        <button class="chip active" data-min="10">10m</button>
        <button class="chip" data-min="15">15m</button>
        <button class="chip" data-min="20">20m</button>
      </div>
    </div>

    <!-- Patrón de respiración -->
    <div class="row-group">
      <div class="row-header">
        <span>Ritmo Visual de Esfera</span>
        <span id="patternDesc">4-4-4-4</span>
      </div>
      <div class="chip-group" id="patternGroup">
        <button class="chip active" data-pattern="box">Cuadrada</button>
        <button class="chip" data-pattern="478">4-7-8</button>
        <button class="chip" data-pattern="coherent">Coherente</button>
        <button class="chip" data-pattern="free">Libre</button>
      </div>
    </div>

    <!-- Ambiente sonoro -->
    <div class="row-group">
      <div class="row-header">
        <span>Fondo Ambiental</span>
        <span id="volLabel">Vol Fondo: 45%</span>
      </div>
      <div class="chip-group" id="soundGroup">
        <button class="chip active" data-sound="rain">Lluvia</button>
        <button class="chip" data-sound="brown">Marrón</button>
        <button class="chip" data-sound="theta">Om 136Hz</button>
        <button class="chip" data-sound="mute">Silencio</button>
      </div>
      <div class="sound-Controls">
        <span style="font-size: 0.78rem; color: var(--text-muted);">🔈</span>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.02" value="0.45" />
        <span style="font-size: 0.78rem; color: var(--text-muted);">🔊</span>
      </div>
    </div>

    <!-- Botones de acción -->
    <div class="action-row">
      <button id="startBtn" class="main-btn">Iniciar sesión</button>
      <button id="bellCueBtn" class="icon-btn" title="Tono suave en cada cambio de respiración">🔔 Tono</button>
      <button id="bowlBtn" class="icon-btn" title="Tocar cuenco tibetano">🥣 Cuenco</button>
    </div>

    <div class="stats-bar">
      <span id="sessionsStat">Sesiones: 0</span>
      <span id="minutesStat">Tiempo total: 0 min</span>
    </div>
  </section>

  <!-- Reproductor para los clips de Voz IA -->
  <audio id="voicePlayer" preload="auto"></audio>

  <script>
    // --- Catálogo de las 5 Meditaciones ---
    const MEDITATION_PROGRAMS = {
      base: {
        name: "Calma Base (Headspace)",
        filesInfo: "Archivos: 01 - 08",
        endGong: true,
        defaultPattern: "box",
        clips: [
          { id: "01", title: "1/8 · Aterrizaje y las 3 respiraciones", fixedStart: 2 },
          { id: "02", title: "2/8 · Peso físico y sonidos", ratio: 0.09 },
          { id: "03", title: "3/8 · Escaneo corporal de arriba abajo", ratio: 0.19 },
          { id: "04", title: "4/8 · El ancla de la respiración", ratio: 0.32 },
          { id: "05", title: "5/8 · Primer rescate de la distracción", ratio: 0.50 },
          { id: "06", title: "6/8 · Segundo rescate: Nubes y tráfico", ratio: 0.70 },
          { id: "07", title: "7/8 · Soltar el enfoque / Mente libre", ratio: 0.88 },
          { id: "08", title: "8/8 · Regreso a la habitación", beforeEnd: 24 }
        ]
      },
      disconnect: {
        name: "Desconectar del Trabajo",
        filesInfo: "Archivos: desc_01 - desc_06",
        endGong: true,
        defaultPattern: "coherent",
        clips: [
          { id: "desc_01", title: "1/6 · Cerrar la etapa del día", fixedStart: 2 },
          { id: "desc_02", title: "2/6 · Soltar tensión de pantallas", ratio: 0.10 },
          { id: "desc_03", title: "3/6 · El trabajo de hoy ha terminado", ratio: 0.25 },
          { id: "desc_04", title: "4/6 · Enfriar la inercia mental", ratio: 0.46 },
          { id: "desc_05", title: "5/6 · Apagar el modo de alerta", ratio: 0.72 },
          { id: "desc_06", title: "6/6 · Regreso tranquilo", beforeEnd: 24 }
        ]
      },
      sleep: {
        name: "Dormir Profundo",
        filesInfo: "Archivos: dormir_01 - dormir_06",
        endGong: false,
        defaultPattern: "478",
        clips: [
          { id: "dormir_01", title: "1/6 · Hundirse en el descanso", fixedStart: 2 },
          { id: "dormir_02", title: "2/6 · Soltar el peso del cuerpo", ratio: 0.10 },
          { id: "dormir_03", title: "3/6 · Apagar las luces del cuerpo", ratio: 0.25 },
          { id: "dormir_04", title: "4/6 · Todo puede esperar a mañana", ratio: 0.46 },
          { id: "dormir_05", title: "5/6 · Flotar sin esfuerzo", ratio: 0.72 },
          { id: "dormir_06", title: "6/6 · Hacia el sueño profundo", beforeEnd: 24 }
        ]
      },
      focus: {
        name: "Enfoque y Claridad",
        filesInfo: "Archivos: foco_01 - foco_06",
        endGong: true,
        defaultPattern: "box",
        clips: [
          { id: "foco_01", title: "1/6 · Postura despierta y presente", fixedStart: 2 },
          { id: "foco_02", title: "2/6 · Estabilidad y equilibrio", ratio: 0.10 },
          { id: "foco_03", title: "3/6 · Punto de enfoque nítido", ratio: 0.25 },
          { id: "foco_04", title: "4/6 · Entrenar el regreso de la atención", ratio: 0.46 },
          { id: "foco_05", title: "5/6 · Mente despejada y serena", ratio: 0.72 },
          { id: "foco_06", title: "6/6 · Activar y mantener la claridad", beforeEnd: 24 }
        ]
      },
      smile: {
        name: "Lo que te hace sonreír",
        filesInfo: "Archivos: sonreir_01 - sonreir_06",
        endGong: true,
        defaultPattern: "coherent",
        clips: [
          { id: "sonreir_01", title: "1/6 · Aterrizaje y respiración suave", fixedStart: 2 },
          { id: "sonreir_02", title: "2/6 · Calmar el cuerpo y la mente", ratio: 0.10 },
          { id: "sonreir_03", title: "3/6 · ¿Qué te ha hecho sonreír hoy?", ratio: 0.26 },
          { id: "sonreir_04", title: "4/6 · Sentir la calidez en el cuerpo", ratio: 0.46 },
          { id: "sonreir_05", title: "5/6 · Reconocer sin aferrarse", ratio: 0.72 },
          { id: "sonreir_06", title: "6/6 · Regreso llevando esa sensación", beforeEnd: 24 }
        ]
      }
    };

    const PATTERNS = {
      box: {
        desc: "4s Inhala · 4s Retén · 4s Exhala · 4s Calma",
        phases: [
          { name: "Inhala", dur: 4, scale: 1.18, freq: 432 },
          { name: "Retén", dur: 4, scale: 1.18, freq: 528 },
          { name: "Exhala", dur: 4, scale: 0.72, freq: 396 },
          { name: "Calma", dur: 4, scale: 0.72, freq: 396 }
        ]
      },
      "478": {
        desc: "4s Inhala · 7s Retén · 8s Exhala",
        phases: [
          { name: "Inhala", dur: 4, scale: 1.2, freq: 432 },
          { name: "Retén", dur: 7, scale: 1.2, freq: 528 },
          { name: "Exhala", dur: 8, scale: 0.7, freq: 396 }
        ]
      },
      coherent: {
        desc: "5s Inhala · 5s Exhala",
        phases: [
          { name: "Inhala", dur: 5, scale: 1.18, freq: 440 },
          { name: "Exhala", dur: 5, scale: 0.72, freq: 396 }
        ]
      },
      free: {
        desc: "Respiración libre",
        phases: [
          { name: "Respira", dur: 8, scale: 1.0, freq: 432 }
        ]
      }
    };

    // --- Estado General ---
    let currentMeditation = "base";
    let voiceMode = "ai";
    let durationMin = 10;
    let totalSec = 600;
    let remainingSec = 600;
    let elapsedSec = 0;
    let currentPattern = "box";
    let currentSound = "rain";
    let isRunning = false;
    let bellCuesEnabled = false;
    let timerInterval = null;
    let phaseTimeout = null;
    let phaseIndex = 0;
    let wakeLock = null;
    let scheduledTimes = {};

    const voicePlayer = document.getElementById("voicePlayer");
    const orbCore = document.getElementById("orbCore");
    const orbRing = document.getElementById("orbRing");
    const phaseLabel = document.getElementById("phaseLabel");
    const timerDisplay = document.getElementById("timerDisplay");
    const startBtn = document.getElementById("startBtn");
    const guideSubtitle = document.getElementById("guideSubtitle");

    // --- Ducking de Audio Ambiental ---
    voicePlayer.addEventListener("play", () => {
      orbCore.classList.add("speaking");
      if (masterGain && audioCtx) {
        const baseVol = parseFloat(document.getElementById("volumeSlider").value);
        masterGain.gain.setTargetAtTime(baseVol * 0.42, audioCtx.currentTime, 0.3);
      }
    });

    voicePlayer.addEventListener("ended", () => {
      orbCore.classList.remove("speaking");
      if (masterGain && audioCtx) {
        const baseVol = parseFloat(document.getElementById("volumeSlider").value);
        masterGain.gain.setTargetAtTime(baseVol, audioCtx.currentTime, 0.5);
      }
      guideSubtitle.textContent = "Silencio consciente... acompaña tu respiración";
    });

    function playMagnificClip(clipObj) {
      guideSubtitle.textContent = clipObj.title;
      const candidates = [
        `./${clipObj.id}.mp3`,
        `./${clipObj.id}.mp3.mp3`,
        `./${clipObj.id}.wav`
      ];

      let attemptIndex = 0;
      function tryNextSource() {
        if (attemptIndex >= candidates.length) {
          orbCore.classList.remove("speaking");
          guideSubtitle.textContent = `${clipObj.title} (Falta subir ${clipObj.id}.mp3)`;
          return;
        }
        voicePlayer.src = candidates[attemptIndex];
        attemptIndex++;
        voicePlayer.play().catch(tryNextSource);
      }
      tryNextSource();
    }

    function buildSchedule(totalSeconds) {
      scheduledTimes = {};
      const program = MEDITATION_PROGRAMS[currentMeditation];
      program.clips.forEach(clip => {
        let triggerSec;
        if (clip.fixedStart !== undefined) {
          triggerSec = clip.fixedStart;
        } else if (clip.beforeEnd !== undefined) {
          triggerSec = Math.max(totalSeconds - clip.beforeEnd, 12);
        } else {
          triggerSec = Math.round(totalSeconds * clip.ratio);
        }
        scheduledTimes[triggerSec] = clip;
      });
    }

    // --- Web Audio API ---
    let audioCtx = null;
    let masterGain = null;
    let activeNodes = [];

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = parseFloat(document.getElementById("volumeSlider").value);
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function stopAmbientSound() {
      activeNodes.forEach(node => {
        try {
          if (node.stop) node.stop();
          if (node.disconnect) node.disconnect();
        } catch (e) {}
      });
      activeNodes = [];
    }

    function startAmbientSound() {
      stopAmbientSound();
      if (!isRunning || currentSound === "mute") return;
      initAudio();

      if (currentSound === "brown" || currentSound === "rain") {
        const bufferSize = 2 * audioCtx.sampleRate;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          output[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = output[i];
          output[i] *= (currentSound === "rain" ? 1.8 : 2.8);
        }
        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = currentSound === "rain" ? "bandpass" : "lowpass";
        filter.frequency.value = currentSound === "rain" ? 900 : 260;
        filter.Q.value = 0.7;

        whiteNoise.connect(filter);
        filter.connect(masterGain);
        whiteNoise.start(0);
        activeNodes.push(whiteNoise, filter);
      } else if (currentSound === "theta") {
        [136.1, 139.1, 204.15].forEach(freq => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.value = freq;
          gain.gain.value = 0.14;
          osc.connect(gain);
          gain.connect(masterGain);
          osc.start();
          activeNodes.push(osc, gain);
        });
      }
    }

    function playTibetanBowl() {
      initAudio();
      const now = audioCtx.currentTime;
      [256, 512, 768, 1024].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq + (idx * 1.5);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.22 / (idx + 1), now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 5.2 - idx * 0.8);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 5.3);
      });
    }

    function playPhaseTone(freq) {
      if (!bellCuesEnabled || !isRunning) return;
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.05, now + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.65);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.7);
    }

    // --- Control de Respiración y Sesión ---
    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, "0");
      const s = (sec % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function runBreathingCycle() {
      if (!isRunning) return;
      const phases = PATTERNS[currentPattern].phases;
      const phase = phases[phaseIndex % phases.length];

      phaseLabel.textContent = phase.name;
      orbCore.style.transition = `transform ${phase.dur}s ease-in-out`;
      orbRing.style.transition = `transform ${phase.dur}s ease-in-out`;
      orbCore.style.transform = `scale(${phase.scale})`;
      orbRing.style.transform = `scale(${phase.scale * 1.15})`;

      playPhaseTone(phase.freq);

      phaseTimeout = setTimeout(() => {
        phaseIndex++;
        runBreathingCycle();
      }, phase.dur * 1000);
    }

    function checkSecondEvents() {
      if (voiceMode !== "ai") return;
      const clipToPlay = scheduledTimes[elapsedSec];
      if (clipToPlay) {
        playMagnificClip(clipToPlay);
      }
    }

    async function requestWakeLock() {
      if ("wakeLock" in navigator) {
        try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
      }
    }

    function releaseWakeLock() {
      if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    }

    function toggleSession() {
      isRunning ? stopSession(false) : startSession();
    }

    function startSession() {
      initAudio();
      isRunning = true;
      phaseIndex = 0;
      elapsedSec = 0;
      totalSec = remainingSec;
      buildSchedule(totalSec);

      startBtn.textContent = "Detener sesión";
      startBtn.classList.add("running");

      playTibetanBowl();
      startAmbientSound();
      requestWakeLock();
      runBreathingCycle();

      if (voiceMode === "mute") {
        guideSubtitle.textContent = `${MEDITATION_PROGRAMS[currentMeditation].name} · Modo Silencio`;
      }

      timerInterval = setInterval(() => {
        remainingSec--;
        elapsedSec++;
        timerDisplay.textContent = formatTime(remainingSec);
        checkSecondEvents();

        if (remainingSec <= 0) {
          stopSession(true);
        }
      }, 1000);
    }

    function stopSession(completed) {
      isRunning = false;
      clearInterval(timerInterval);
      clearTimeout(phaseTimeout);
      stopAmbientSound();
      releaseWakeLock();
      voicePlayer.pause();
      orbCore.classList.remove("speaking");

      orbCore.style.transition = "transform 0.6s ease";
      orbRing.style.transition = "transform 0.6s ease";
      orbCore.style.transform = "scale(0.8)";
      orbRing.style.transform = "scale(0.65)";

      startBtn.textContent = "Iniciar sesión";
      startBtn.classList.remove("running");

      if (completed) {
        if (MEDITATION_PROGRAMS[currentMeditation].endGong) {
          playTibetanBowl();
        }
        phaseLabel.textContent = "Namasté";
        guideSubtitle.textContent = "Sesión completada.";
        saveStats(durationMin);
      } else {
        phaseLabel.textContent = "Pausa";
        guideSubtitle.textContent = "Toca el círculo cuando quieras reanudar";
      }
      remainingSec = durationMin * 60;
      timerDisplay.textContent = formatTime(remainingSec);
    }

    // --- Estadísticas ---
    function loadStats() {
      const s = parseInt(localStorage.getItem("calma_sessions") || "0", 10);
      const m = parseInt(localStorage.getItem("calma_minutes") || "0", 10);
      document.getElementById("sessionsStat").textContent = `Sesiones: ${s}`;
      document.getElementById("minutesStat").textContent = `Tiempo total: ${m} min`;
    }

    function saveStats(addedMin) {
      const s = parseInt(localStorage.getItem("calma_sessions") || "0", 10) + 1;
      const m = parseInt(localStorage.getItem("calma_minutes") || "0", 10) + addedMin;
      localStorage.setItem("calma_sessions", s);
      localStorage.setItem("calma_minutes", m);
      loadStats();
    }

    // --- Eventos UI ---
    orbCore.addEventListener("click", toggleSession);
    startBtn.addEventListener("click", toggleSession);
    document.getElementById("bowlBtn").addEventListener("click", playTibetanBowl);

    document.getElementById("bellCueBtn").addEventListener("click", (e) => {
      bellCuesEnabled = !bellCuesEnabled;
      e.currentTarget.classList.toggle("active", bellCuesEnabled);
    });

    document.getElementById("sosBtn").addEventListener("click", () => {
      if (isRunning) stopSession(false);
      durationMin = 2;
      remainingSec = 120;
      currentMeditation = "base";
      currentPattern = "box";
      currentSound = "rain";
      timerDisplay.textContent = formatTime(remainingSec);
      startSession();
    });

    document.getElementById("meditationGroup").addEventListener("click", (e) => {
      const card = e.target.closest(".med-card");
      if (!card) return;
      document.querySelectorAll("#meditationGroup .med-card").forEach(c => c.classList.remove("active"));
      card.classList.add("active");
      currentMeditation = card.dataset.med;

      const prog = MEDITATION_PROGRAMS[currentMeditation];
      document.getElementById("medPackInfo").textContent = prog.filesInfo;
      guideSubtitle.textContent = `${prog.name} lista para empezar`;

      currentPattern = prog.defaultPattern;
      document.querySelectorAll("#patternGroup .chip").forEach(c => {
        c.classList.toggle("active", c.dataset.pattern === currentPattern);
      });
      document.getElementById("patternDesc").textContent = PATTERNS[currentPattern].desc;

      if (isRunning) {
        buildSchedule(totalSec);
      }
    });

    document.getElementById("voiceModeGroup").addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      document.querySelectorAll("#voiceModeGroup .chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      voiceMode = btn.dataset.voice;
      document.getElementById("voiceStatus").textContent = voiceMode === "ai" ? "Voz IA activa" : "Solo sonido ambiental";
      if (voiceMode === "mute") {
        voicePlayer.pause();
        orbCore.classList.remove("speaking");
      }
    });

    document.getElementById("durationGroup").addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      document.querySelectorAll("#durationGroup .chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      durationMin = parseInt(btn.dataset.min, 10);
      if (!isRunning) {
        remainingSec = durationMin * 60;
        timerDisplay.textContent = formatTime(remainingSec);
      }
    });

    document.getElementById("patternGroup").addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      document.querySelectorAll("#patternGroup .chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      currentPattern = btn.dataset.pattern;
      document.getElementById("patternDesc").textContent = PATTERNS[currentPattern].desc;
      if (isRunning) {
        clearTimeout(phaseTimeout);
        phaseIndex = 0;
        runBreathingCycle();
      }
    });

    document.getElementById("soundGroup").addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      document.querySelectorAll("#soundGroup .chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      currentSound = btn.dataset.sound;
      if (isRunning) startAmbientSound();
    });

    document.getElementById("volumeSlider").addEventListener("input", (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById("volLabel").textContent = `Vol Fondo: ${Math.round(val * 100)}%`;
      if (masterGain) masterGain.gain.value = val;
    });

    loadStats();

    // --- Instalación PWA ---
    let deferredPrompt = null;
    const installBtn = document.getElementById("installBtn");

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = "inline-block";
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = "none";
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
